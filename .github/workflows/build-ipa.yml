name: Build IPA for AltStore

on:
  workflow_dispatch:       # 手动触发
  push:
    tags: [ 'v*' ]         # 打 tag 时自动构建

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          # Create Payload directory
          mkdir -p ios/App/build/Payload

          # Copy .app (find it in derived data)
          app_path=$(find ios/App/build -name "*.app" -type d | head -1)
          cp -R "$app_path" ios/App/build/Payload/

          # Zip as IPA
          cd ios/App/build
          zip -qr App.ipa Payload/
          echo "IPA created at ios/App/build/App.ipa"
          ls -lh App.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkillHubChat-AltStore
          path: ios/App/build/App.ipa
          if-no-files-found: error
